# game.toml — Pokémon FireRed Version (GBA), USA v1.0
#
# This is ONE variant of the FRLG multi-variant repo. Its sibling is
# ../leafgreen/. The runner reads this file (path given to the binary via
# the GBARECOMP_DEFAULT_GAME_CONFIG compile-def, default
# "variants/firered/game.toml") to decide which ROM to load, which region
# config to layer in, where the entry point is, and what save chip is
# expected. All paths below resolve relative to THIS file's directory
# (variants/firered/), per runtime.cpp resolve_config_path.

[game]
name           = "Pokémon FireRed Version"
short_name     = "firered"
default_region = "usa"

# ── BIOS identity ────────────────────────────────────────────────────
# The GBA BIOS is real, executed, recompiled code. The runner refuses to
# launch without a hash-verified BIOS. Shared across every gbarecomp game.
# Path is relative to this file: variants/firered/ -> repo -> container.
[bios]
path = "../../../gbarecomp/bios/gba_bios.bin"   # override via --bios
sha1 = "300c20df6731a33952ded8c436f7f186d25d3492"

# ── ROM identity ─────────────────────────────────────────────────────
[rom]
path = "roms/firered_usa.gba"   # user-provided; gitignored
# sha1 is filled in per region in config/<region>.toml (rev0 = 41cb23d8…).

# ── Recompiler entry & layout (consumed by gba_recompile) ───────────
# ── Recompiler program identity (consumed by gba_recompile) ─────────
#
# This file is the BASE config for the recompile: it owns [program] and
# [identity] and wins every conflict with the generated overlay layered on
# top of it (symbols/BPRE_symbols.toml).
#
# Until 2026-08-21 the recompile was driven by the importer's generated
# symbols/firered.toml INSTEAD of this file, because only that file carried a
# [program] table — so every import replaced the hand-authored config and
# nothing reviewed could survive one. These values are carried over verbatim.
[program]
name         = "Pokemon FireRed Version (USA)"
id           = "firered_usa"
load_address = 0x08000000
size         = 0x01000000
entry_pc     = 0x08000000
codegen_shards = 64

[identity]
sha1 = "41cb23d8dccc8ebd7c649cd8fbb58eeace6e2fdc"

# ── Runtime code copy that is NOT symbol-derivable ──────────────────
#
# ReadFlashId stack-copies the tiny ReadFlash1 helper (via SetReadFlash1)
# into a stack local before reading the flash chip's manufacturer/device ID.
# The destination is a stack address, so unlike the IntrMain and SoundMainRAM
# copies there is no destination SYMBOL for the importer to resolve — it has
# to be stated here, and it is deterministic for this boot path.
#
# This is load-bearing, not an optimization: without it ReadFlash1 is not
# statically recompiled, flash detection fails, gFlashMemoryPresent stays
# FALSE, and AgbMain hands SetMainCallback2 a NULL callback — the game boots
# to a black screen and never recovers.
[[code_copy]]
runtime_start = 0x03007DCC
source_start  = 0x081DEA30
size          = 0x4
name          = "ReadFlash1_stack_Buffer"
note = "ReadFlashId stack-copies ReadFlash1 via SetReadFlash1 into readFlash1Buffer"

[[extra_func]]
addr = 0x03007DCC
mode = "thumb"
name = "ReadFlash1_stack"
note = "THUMB entry of the ReadFlash1 stack copy above"

# NOTE: the fields below are consumed by the runner/tooling; the recompile's
# seeds come from --symbols and its data ranges from the overlay.
[recompiler]
entry_point   = "0x08000000"
seeds         = "symbols/imported_symbols.tsv"
boundaries    = "symbols/function_boundaries.tsv"
out_dir       = "generated"
strict        = true

# ── Save chip ────────────────────────────────────────────────────────
# FireRed/LeafGreen use 1 Mbit (128 KB) flash (agb_flash_1m).
[save]
type = "flash1m"          # one of: sram | flash512 | flash1m | eeprom

# ── Runtime ─────────────────────────────────────────────────────────
# Each variant gets a distinct debug_port so multiple runners coexist:
#   firered 19852 · leafgreen 19862 · ruby 19872 · sapphire 19882 · emerald 19892
[runtime]
debug_port    = 19852
window_title  = "FireRedRecomp"

[functions]
arm   = []
thumb = []
