# Reviewed dispatch-miss seeds — HAND-OWNED, not importer output.
#
# Pokemon LeafGreen Version (USA)
#
# Each entry is an interior guest PC that is a legitimate resume
# point but not a function entry: an IRQ or SWI returns into the
# middle of an already-generated body (the WaitForVBlank busy
# spin, the m4a mixer, libgcc's memcpy/divsi). Static discovery
# cannot reach them, so without a seed here each one dispatch
# misses and gets bridged through the interpreter.
#
# They were found from the self-heal miss log and reviewed by
# hand. This file is a CONFIG OVERLAY layered on game.toml and is
# never written by the importer, so re-importing symbols cannot
# lose them. Add new ones only after reviewing a miss log entry.
#
# Migrated 2026-08-21 out of the importer's generated TOML, which
# used to double as the recompile config.

# Must match the base config: these are exact addresses in
# one specific binary.
[identity]
sha1 = "574fa542ffebb14be69902d1d36f1ec0a4afd71e"

[[extra_func]]
addr = 0x080008AC
mode = "thumb"
resume = true
name = "resume_080008ac"
note = "reviewed dispatch-miss seed: WaitForVBlank spin resume"

